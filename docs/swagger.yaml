info:
  contact:
    email: justinfarrellwebdev@gmail.com
    name: API Support
  description: This is the open-source Call to Power and Call to Power 2 server project.
    This project is not sponsored, maintained or affiliated with Activision.
  title: Open Call to Power Server
paths:
  /account/create_account:
    post:
      consumes:
      - application/json
      description: This endpoint creates a new multiplayer account, protected by a
        password.
      parameters:
      - description: account creation request body
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/account.CreateAccountArgs'
      produces:
      - application/json
      responses:
        "201":
          description: Account successfully created
          schema:
            type: integer
        "400":
          description: Bad Request
          schema: {}
        "403":
          description: Forbidden
          schema: {}
        "500":
          description: Internal Server Error
          schema: {}
      summary: Create a new account
      tags:
      - account
  /account/delete_account:
    delete:
      consumes:
      - application/json
      description: This endpoint deletes a player account for the authenticated account
        owner and invalidates that account's sessions after a successful delete.
      parameters:
      - description: account deletion request body
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/account.DeleteAccountArgs'
      produces:
      - application/json
      responses:
        "200":
          description: Successfully deleted account!
          schema:
            type: string
        "400":
          description: Bad Request
          schema: {}
        "401":
          description: Unauthorized
          schema: {}
        "403":
          description: Forbidden
          schema: {}
        "500":
          description: Internal Server Error
          schema: {}
      summary: Deletes an account
      tags:
      - account
  /account/get_account:
    get:
      consumes:
      - application/json
      description: This endpoint gets a multiplayer account's info and requires a
        valid session.
      parameters:
      - description: account ID
        in: query
        name: account_id
        required: true
        type: integer
      - description: session ID
        in: query
        name: session_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Account successfully retrieved
          schema:
            $ref: '#/definitions/account.Account'
        "400":
          description: Bad Request
          schema: {}
        "401":
          description: Unauthorized
          schema: {}
        "404":
          description: Not Found
          schema: {}
        "500":
          description: Internal Server Error
          schema: {}
      summary: Gets an account
      tags:
      - account
  /account/login:
    post:
      consumes:
      - application/json
      description: This endpoint verifies account credentials and returns a session
        for future authenticated requests.
      parameters:
      - description: account login request body
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/account.LoginAccountArgs'
      produces:
      - application/json
      responses:
        "200":
          description: Login successful
          schema:
            $ref: '#/definitions/account.LoginAccountResponse'
        "400":
          description: Bad Request
          schema: {}
        "401":
          description: Unauthorized
          schema: {}
        "500":
          description: Internal Server Error
          schema: {}
      summary: Logs into an account
      tags:
      - account
  /account/reset_password:
    post:
      consumes:
      - application/json
      description: This endpoint resets an account password for the authenticated
        account owner and invalidates the account's other sessions.
      parameters:
      - description: password reset request body
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/account.ResetPasswordArgs'
      produces:
      - application/json
      responses:
        "200":
          description: Successfully reset password!
          schema:
            type: string
        "400":
          description: Bad Request
          schema: {}
        "401":
          description: Unauthorized
          schema: {}
        "403":
          description: Forbidden
          schema: {}
        "500":
          description: Internal Server Error
          schema: {}
      summary: Resets an account password
      tags:
      - account
  /account/update_account:
    put:
      consumes:
      - application/json
      description: This endpoint updates an account's info for the authenticated account
        owner.
      parameters:
      - description: account update request body
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/account.UpdateAccountArgs'
      produces:
      - application/json
      responses:
        "200":
          description: Successfully updated account!
          schema:
            type: string
        "400":
          description: Bad Request
          schema: {}
        "401":
          description: Unauthorized
          schema: {}
        "403":
          description: Forbidden
          schema: {}
        "500":
          description: Internal Server Error
          schema: {}
      summary: Updates an account
      tags:
      - account
  /game/{game_id}/{command}:
    post:
      consumes:
      - application/json
      description: The server derives player identity from session_id and submits
        one canonical command. Unknown fields and client authority are rejected.
      parameters:
      - description: game ID
        in: path
        name: game_id
        required: true
        type: integer
      - description: command name
        in: path
        name: command
        required: true
        type: string
      - description: command envelope plus command-specific payload
        in: body
        name: command
        required: true
        schema:
          $ref: '#/definitions/gameplayhttp.CommandRequestDocs'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/gameplayhttp.CommandResponseDocs'
        "400":
          description: malformed or unknown command field
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: missing or invalid session
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: game membership or controller is not authorized
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: stale revision or idempotency conflict
          schema:
            additionalProperties:
              type: string
            type: object
        "422":
          description: invalid command phase or terminal game
          schema:
            additionalProperties:
              type: string
            type: object
        "429":
          description: rate limit exceeded
          schema:
            $ref: '#/definitions/ratelimit.Message'
      summary: Submit a gameplay command
      tags:
      - gameplay
  /game/add_ai:
    post:
      consumes:
      - application/json
      description: When target_account_id is supplied, this endpoint converts an existing
        joined setup player to AI control. When target_account_id is omitted, the
        owner creates a server-managed AI account/player slot with the supplied country.
      parameters:
      - description: AI setup request body
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/game.AddAIArgs'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/game.Game'
        "400":
          description: Bad Request
          schema: {}
        "401":
          description: Unauthorized
          schema: {}
        "403":
          description: Forbidden
          schema: {}
        "404":
          description: Not Found
          schema: {}
        "409":
          description: Conflict
          schema: {}
      summary: Add an AI player
      tags:
      - game
  /game/create_game:
    post:
      consumes:
      - application/json
      description: This endpoint creates a new multiplayer game setup record using
        CTP2-first defaults for omitted setup fields.
      parameters:
      - description: Game creation request body
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/game.CreateGameDocsArgs'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/game.Game'
        "400":
          description: Bad Request
          schema: {}
        "401":
          description: Unauthorized
          schema: {}
        "500":
          description: Internal Server Error
          schema: {}
      summary: Create a new game
      tags:
      - game
  /game/delete_game:
    delete:
      consumes:
      - application/json
      description: This endpoint deletes a setup-stage game only for the authenticated
        game owner.
      parameters:
      - description: game deletion request body
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/game.DeleteGameArgs'
      produces:
      - application/json
      responses:
        "200":
          description: Successfully deleted game!
          schema:
            type: string
        "400":
          description: Bad Request
          schema: {}
        "401":
          description: Unauthorized
          schema: {}
        "403":
          description: Forbidden
          schema: {}
        "404":
          description: Not Found
          schema: {}
        "409":
          description: Conflict
          schema: {}
        "500":
          description: Internal Server Error
          schema: {}
      summary: Delete a game
      tags:
      - game
  /game/get_game:
    get:
      consumes:
      - application/json
      description: This endpoint returns a game's persisted setup fields for any authenticated
        account that is still joined to the game, including player country and ping
        values.
      parameters:
      - description: game ID
        in: query
        name: game_id
        required: true
        type: integer
      - description: session ID
        in: query
        name: session_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/game.Game'
        "400":
          description: Bad Request
          schema: {}
        "401":
          description: Unauthorized
          schema: {}
        "403":
          description: Forbidden
          schema: {}
        "404":
          description: Not Found
          schema: {}
        "500":
          description: Internal Server Error
          schema: {}
      summary: Get a game
      tags:
      - game
  /game/kick_player:
    post:
      consumes:
      - application/json
      description: This endpoint lets the authenticated game owner remove a non-owner
        player from a setup-stage game. Kicked players lose access to game state endpoints
        immediately.
      parameters:
      - description: kick player request body
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/game.KickGamePlayerArgs'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/game.Game'
        "400":
          description: Bad Request
          schema: {}
        "401":
          description: Unauthorized
          schema: {}
        "403":
          description: Forbidden
          schema: {}
        "404":
          description: Not Found
          schema: {}
        "409":
          description: Conflict
          schema: {}
        "500":
          description: Internal Server Error
          schema: {}
      summary: Kick a game player
      tags:
      - game
  /game/lock_game:
    post:
      consumes:
      - application/json
      description: This endpoint updates a setup-stage game's locked flag only for
        the authenticated game owner and returns the persisted game state.
      parameters:
      - description: game lock request body
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/game.LockGameArgs'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/game.Game'
        "400":
          description: Bad Request
          schema: {}
        "401":
          description: Unauthorized
          schema: {}
        "403":
          description: Forbidden
          schema: {}
        "404":
          description: Not Found
          schema: {}
        "409":
          description: Conflict
          schema: {}
        "500":
          description: Internal Server Error
          schema: {}
      summary: Lock or unlock a game
      tags:
      - game
  /game/rename_game:
    post:
      consumes:
      - application/json
      description: This endpoint updates a setup-stage game's name only for the authenticated
        game owner and returns the persisted game state.
      parameters:
      - description: game rename request body
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/game.RenameGameArgs'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/game.Game'
        "400":
          description: Bad Request
          schema: {}
        "401":
          description: Unauthorized
          schema: {}
        "403":
          description: Forbidden
          schema: {}
        "404":
          description: Not Found
          schema: {}
        "409":
          description: Conflict
          schema: {}
        "500":
          description: Internal Server Error
          schema: {}
      summary: Rename a game
      tags:
      - game
  /game/select_country:
    post:
