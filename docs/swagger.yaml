  game.UpdateGameStartingGoldArgs:
    properties:
      game_id:
        type: integer
      session_id:
        type: integer
      starting_gold:
        type: integer
    type: object
  game.UpdateGameStartingSettlersArgs:
    properties:
      game_id:
        type: integer
      session_id:
        type: integer
