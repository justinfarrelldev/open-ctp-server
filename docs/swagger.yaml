      description: This endpoint is reserved for future CTP1 space-layer support.
        Authenticated joined players may call it today, but it always returns the
        fixed 404 JSON placeholder for CTP2 worlds.
      parameters:
      - description: game ID
        in: path
        name: game_id
        required: true
