        snapshot.'
      parameters:
      - description: game ID
        in: path
        name: game_id
        required: true
        type: integer
      - description: session ID
        in: query
        name: session_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "400":
          description: invalid request method, missing game_id, or invalid game_id
          schema:
            type: string
        "401":
          description: missing or invalid session
          schema:
            type: string
        "403":
          description: only joined game players may perform this action
          schema:
            type: string
        "404":
          description: game or persisted world not found
          schema:
            type: string
        "409":
          description: game has not started
          schema:
            type: string
        "410":
          description: use viewer-safe gameplay current resync
          schema:
            type: string
        "500":
          description: internal server error
          schema:
            type: string
      summary: Retired canonical world download
      tags:
      - world
