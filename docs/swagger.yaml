definitions:
  account.Account:
    description: Structure for representing a player account.
    properties:
      email:
        description: Email is the email address of the player.
        type: string
      experience_level:
        allOf:
        - $ref: '#/definitions/account.ExperienceLevel'
        description: ExperienceLevel represents the player's experience level (0=beginner,
          1=easy, 2=medium, 3=hard, 4=very hard, 5=impossible)
      info:
        description: Info contains additional information about the player.
        type: string
      location:
        description: Location indicates the player's real-life location.
        type: string
      name:
        description: Name is the name of the player.
        type: string
    type: object
  account.AccountParam:
    description: Structure for representing a player account with non-required fields.
    properties:
      email:
        description: Email is the email address of the player.
        type: string
      experience_level:
        allOf:
        - $ref: '#/definitions/account.ExperienceLevel'
        description: ExperienceLevel represents the player's experience level (0=beginner,
          1=easy, 2=medium, 3=hard, 4=very hard, 5=impossible)
      info:
        description: Info contains additional information about the player.
        type: string
      location:
        description: Location indicates the player's real-life location.
        type: string
      name:
        description: Name is the name of the player.
        type: string
    type: object
  account.CreateAccountArgs:
    description: Structure for the account creation request payload.
    properties:
      account:
        allOf:
        - $ref: '#/definitions/account.Account'
        description: The account to create.
      password:
        description: The password for the account to be created
        type: string
    type: object
  account.DeleteAccountArgs:
    description: Structure for the account deletion request payload.
    properties:
      account_id:
        description: The account ID for the account that will be deleted.
        type: integer
      session_id:
        description: A valid session ID for the account (so we know they are signed
          in)
        type: integer
    type: object
  account.ExperienceLevel:
    enum:
    - 0
    - 1
    - 2
    - 3
    - 4
    - 5
    type: integer
    x-enum-varnames:
    - Beginner
    - Easy
    - Medium
    - Hard
    - Very_Hard
    - Impossible
  account.LoginAccountArgs:
    description: Structure for the account login request payload.
    properties:
      email:
        type: string
      password:
        type: string
    type: object
  account.LoginAccountResponse:
    description: Structure for the account login response payload.
    properties:
      account_id:
        type: integer
      expires_at:
        type: string
      session_id:
        type: integer
    type: object
  account.ResetPasswordArgs:
    description: Structure for the password reset request payload.
    properties:
      account_id:
        type: integer
      current_password:
        type: string
      new_password:
        type: string
      session_id:
        type: integer
    type: object
  account.UpdateAccountArgs:
    description: Structure for the account update request payload.
    properties:
      account:
        allOf:
        - $ref: '#/definitions/account.AccountParam'
        description: The account to create.
      account_id:
        description: The account ID for the account that will be updated.
        type: integer
      password:
        description: The password for the account to be created
        type: string
      session_id:
        description: A valid session ID for the account (so we know they are signed
          in)
        type: integer
    type: object
  auth.Session:
    properties:
      account_id:
        type: integer
      created_at:
        type: string
      expires_at:
        type: string
      id:
        type: integer
    type: object
  game.AddAIArgs:
    properties:
      country:
        type: string
      game_id:
        type: integer
      name:
        type: string
      session_id:
        type: integer
      target_account_id:
        type: integer
    type: object
  game.CreateGameDocsArgs:
    properties:
      exclusions_json:
        additionalProperties: {}
        type: object
      is_locked:
        type: boolean
      is_public:
        type: boolean
      lobby_id:
        type: integer
      name:
        type: string
      owner_account_id:
        type: integer
      password:
        type: string
      password_protected:
        type: boolean
      rules_json:
        items: {}
        type: array
      session_id:
        type: integer
      starting_gold:
        type: integer
      starting_settlers:
        type: integer
      style:
        type: string
    type: object
  game.DeleteGameArgs:
    properties:
      game_id:
        type: integer
      session_id:
        type: integer
    type: object
  game.Game:
    properties:
      climate:
        type: string
      created_at:
        type: string
      exclusions_json:
        type: string
      id:
        type: integer
      is_locked:
        type: boolean
      is_public:
        type: boolean
      lobby_id:
        type: integer
      map_size:
        type: string
      name:
        type: string
      owner_account_id:
        type: integer
      password:
        type: string
      password_protected:
        type: boolean
      players:
        items:
          $ref: '#/definitions/game.GamePlayer'
        type: array
      rules_json:
        type: string
      started_at:
        type: string
      starting_gold:
        type: integer
      starting_settlers:
        type: integer
      status:
        type: string
      style:
        type: string
      updated_at:
        type: string
      wetness:
        type: integer
    type: object
  game.GamePlayer:
    properties:
      account_id:
        type: integer
      controller_kind:
        type: string
      country:
        type: string
      created_at:
        type: string
      game_id:
        type: integer
      id:
        type: integer
      joined_at:
        type: string
      ping:
