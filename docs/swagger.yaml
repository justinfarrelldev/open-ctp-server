  /lobby/connect_lobby:
    get:
      description: This endpoint opens a text/event-stream connection for the authenticated
        account. It joins the account to the lobby when needed, rejects accounts that
        are already in a different open lobby, returns HTTP 410 Gone for inactive
        closed lobbies, and emits SSE events named player_connected, player_left,
        and chat_message with JSON payloads in each data line.
      parameters:
      - description: session ID
        in: query
        name: session_id
        required: true
        type: integer
      - description: lobby ID
        in: query
        name: lobby_id
        required: true
