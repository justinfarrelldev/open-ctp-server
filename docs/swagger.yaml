      session_id:
        type: integer
    type: object
  game.SelectGameCountryArgs:
    properties:
      country:
        type: string
      game_id:
        type: integer
      session_id:
        type: integer
    type: object
  game.SetPublicGameArgs:
    properties:
      game_id:
        type: integer
      is_public:
        type: boolean
